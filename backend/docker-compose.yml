services:
  # ==========================================
  # 1. CỤM DATABASE (POSTGRESQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: food_ai_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-food_app_db}
    volumes:
      - postgres_data_new:/var/lib/postgresql/data # Lưu dữ liệu cứng, tắt Docker không bị mất
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ==========================================
  # 2. CỤM BACKEND (FASTAPI)
  # ==========================================
  api:
    build: .
    container_name: food_ai_api
    restart: always
    ports:
      - "5000:8000"
    volumes:
      - .:/app # CỬA SỔ THẦN KỲ: Ánh xạ thư mục code bên ngoài vào thẳng Docker
    environment:
      # Truyền đường dẫn kết nối DB cho FastAPI
      - DATABASE_URL=postgresql://${POSTGRES_USER:-food_app}:${POSTGRES_PASSWORD:-123456}@db:5432/${POSTGRES_DB:-food_app_db}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "app.workers"]
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-food_app}:${POSTGRES_PASSWORD:-123456}@db:5432/${POSTGRES_DB:-food_app_db}
    depends_on:
      db:
        condition: service_healthy

  # ==========================================
  # 3. CỤM FLYWAY (QUẢN LÝ MIGRATION DB)
  # ==========================================
  flyway:
    image: flyway/flyway:9-alpine
    container_name: food_ai_flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-food_app_db}
      - FLYWAY_USER=${POSTGRES_USER:-food_app}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - FLYWAY_BASELINE_ON_MIGRATE=true
      - FLYWAY_BASELINE_VERSION=0
    profiles:
      - tools
    command: migrate # Lệnh chạy khi container khởi động

volumes:
  postgres_data_new:
